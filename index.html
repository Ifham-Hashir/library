<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Library</title>
</head>
<body>
  <div class="header">
    <button id="add-button">Add +</button>
    <h1>MY LIBRARY</h1>
  </div>
  <dialog>
    <form>
      <p>
        <label for="title">
          Title:
          <input type="text" id="title" name="title" required minlength="5">
        </label>
      </p>
      <p>
        <label for="author">
          Author:
          <input type="text" required id="author" name="author" minlength="10">
        </label>
      </p>
      <p>
        <label for="pages">
          Pages:
          <input type="number" required id="pages" name="pages" min="10">
        </label>
      </p>
      <p>
        <label for="read">
          Read:
          <input type="checkbox" id="read" name="read">
        </label>
      </p>
      <button id="confirm-button" type="submit">Confirm</button>
    </form>
  </dialog>
  <div class="container"></div>
</body>
</html>
